name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 25 installieren
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Gradle 9.4 einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.4

      - name: Build
        run: gradle build --no-daemon

      - name: Jar hochladen
        uses: actions/upload-artifact@v4
        with:
          name: samurai-sunset-jar
          path: build/libs/*.jar
